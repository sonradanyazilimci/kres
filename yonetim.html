<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sağlayıcı Paneli — Anaokul 360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <meta name="theme-color" content="#ff8a5c" />
</head>
<body>
  <div class="panel-icerik" style="max-width:1180px;margin:0 auto">
    <div class="panel-ust">
      <h1>Sağlayıcı Paneli</h1>
      <div class="kullanici-rozet">
        <span class="avatar">SY</span>
        <span id="userAd">...</span>
        <button class="btn btn--ghost btn--sm" id="cikisBtn" style="margin-left:8px">Çıkış</button>
      </div>
    </div>

    <div id="ozet" class="mb-2"></div>
    <div id="yaklasan-bitisler"></div>

    <div class="kutu">
      <div class="kutu__ust">
        <h2>Sağlayıcı Araçları</h2>
      </div>
      <div class="arac-izgara">
        <button class="btn btn--ghost" id="anasayfaBtn">🖥️ Anasayfa İçeriği</button>
        <button class="btn btn--ghost" id="odemelerBtn">💰 Abonelik Ödemeleri</button>
        <button class="btn btn--ghost" id="sistemDuyuruBtn">📣 Sistem Duyurusu</button>
        <button class="btn btn--ghost" id="superAdminBtn">🛡️ Süper-admin Ekle</button>
        <button class="btn btn--primary" id="yeniKresBtn">＋ Yeni Kreş</button>
      </div>
    </div>

    <div class="kutu">
      <div class="kutu__ust">
        <h2>Kreşler</h2>
      </div>
      <div class="tablo-sar"><table class="veri-tablo kres-mobil" id="kres-tablo"></table></div>
    </div>
  </div>

  <script type="module" src="js/yonetim.js"></script>
</body>
</html>
